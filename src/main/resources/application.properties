spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/knowledge_environment
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show_sql=false
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
server.port=3030
spring.main.allow-bean-definition-overriding=true
enterprise-search.host=http://enterprisesearch:3002
elasticsearch.host=http://es-search:9200
enterprise-search.engine.name=spatial-viewer-test
elasticsearch.index.name=spatial-viewer-test
recently-released-date=${RECENTLY_RELEASED_DATE}
spring.graphql.graphiql.enabled=true